name: Profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: Season to force in this run, to preview it on any date
        type: choice
        options: [auto, winter, tamborrada, zinemaldia, halloween]
        default: auto
  push:
    branches: [main]

# A burst of coins queues a single regeneration instead of one per coin.
concurrency:
  group: profile-${{ github.ref }}

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a # main, 2026-11-01
        with:
          github_user_name: ${{ github.repository_owner }}
          games: galaga
      # Pinned to the v1.0.0 commit: young project with write access to the repo and access to the token.
      - uses: monokernn/readme-atelier@9248beb14c734269c02f36a590617db7c3df15ad
        with:
          # Scopeless PAT: never grant "repo", the image is public.
          token: ${{ secrets.METRICS_TOKEN }}
          # Only its SVG matters: README and main stay untouched.
          commit: 'false'
      - run: >-
          gh api graphql -f login="$GITHUB_REPOSITORY_OWNER" -f query='query($login:String!){user(login:$login){
          contributionsCollection{contributionCalendar{totalContributions}}}}'
          > calendar.json
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      # One coin per player: repeated issues from one account do not inflate the counter.
      - run: >-
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=coin&state=all&per_page=100"
          --jq '.[].user.login' | sort -u | wc -l > coins.txt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      # The date lives in a Secret: the repo is public and only the age is published.
      - run: python3 scripts/merge_svg.py dist/galaga-contribution-graph-dark.svg atelier/header.svg calendar.json coins.txt dist/profile.svg dist/insert-coin.svg
        env:
          BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
          SEASON: ${{ inputs.season }}
      - uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          # Only main publishes the profile image; branches publish their own preview.
          target_branch: ${{ github.ref == 'refs/heads/main' && 'output' || format('preview-{0}', github.ref_name) }}
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
