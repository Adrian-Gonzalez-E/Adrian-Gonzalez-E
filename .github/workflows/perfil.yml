name: Perfil

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  perfil:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: galaga
      # Fijada al commit de v1.0.0: proyecto joven con escritura en el repo y acceso al token.
      - uses: monokernn/readme-atelier@9248beb14c734269c02f36a590617db7c3df15ad
        with:
          # PAT sin scopes: no dar nunca "repo", la imagen es pública.
          token: ${{ secrets.METRICS_TOKEN }}
          # Solo interesa su SVG: el README y el main no se tocan.
          commit: 'false'
      - run: >-
          gh api graphql -f login="$GITHUB_REPOSITORY_OWNER" -f query='query($login:String!){user(login:$login){
          contributionsCollection{contributionCalendar{totalContributions}}}}'
          > calendario.json
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      # La fecha va en un Secret: el repo es público y solo se publica la edad.
      - run: python3 scripts/unir_svg.py dist/galaga-contribution-graph-dark.svg atelier/header.svg calendario.json dist/perfil.svg
        env:
          FECHA_NACIMIENTO: ${{ secrets.FECHA_NACIMIENTO }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Solo main publica en la imagen del perfil; las ramas, en su vista previa.
          target_branch: ${{ github.ref == 'refs/heads/main' && 'output' || format('preview-{0}', github.ref_name) }}
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
